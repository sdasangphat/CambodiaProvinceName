  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Noto Sans Khmer', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    h1 { 
      margin: 10px 0 1px; 
      font-size: 3rem; 
      font-family: 'Google Sans', sans-serif;
      text-align: center;
      font-weight: 1000;
    }

    h2 { 
      margin: 10px 0 1px; 
      font-size: 1rem; 
      font-family: sans-serif;
      color: #888888;
      font-weight: 300;
    }

    .score { 
      font-size: 1.2rem; 
      color: #38bdf8; 
      font-weight: bold; 
      font-family: 'Google Sans', sans-serif;
      margin-bottom: 15px; 
      margin-top: 15px; 
    }

    input {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.1rem;
      padding: 12px 18px;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #fff;
      width: 100%;
      max-width: 380px;
      outline: none;
      text-align: center;
    }
    input:focus { border-color: #38bdf8; }
    .input-wrap {
      position: relative;
      width: 100%;
      max-width: 380px;
    }
    .map-wrapper {
      width: 100%;
      max-width: 750px;
      margin-top: 20px;
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #334155;
    }
    svg { width: 100%; height: auto; display: block; }
    #features path {
      fill: #334155;
      stroke: #0f172a;
      stroke-width: 1;
      stroke-linejoin: round;
      transition: fill 0.3s ease;
      cursor: default;
    }
    #features path.found {
      fill: #22c55e;
    }
    .unlocked {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 750px;
    }
    .chip {
      background: #22c55e20;
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .hint {
      color: #64748b;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.85rem;
      margin-top: 4px;
    }
  </style>
</head>

      { id: 'KH13', khmer: 'ព្រះវិហារ', names: ['preah vihear', 'preah vihea', 'prea vihear', 'preah vihar', 'ព្រះវិហារ'] },
      { id: 'KH14', khmer: 'ព្រៃវែង', names: ['prey veng', 'prey veang', 'prei veng', 'ព្រៃវែង'] },
      { id: 'KH15', khmer: 'ពោធិ៍សាត់', names: ['pursat', 'poursat', 'pouthisat', 'posat', 'ពោធិ៍សាត់', 'ពោធិសាត់'] },
      { id: 'KH16', khmer: 'រតនគិរី', names: ['ratanakiri', 'rattanakiri', 'ratanak kiri', 'rattanak kiri', 'ratanakkiri', 'រតនគិរី'] },
      { id: 'KH17', khmer: 'សៀមរាប', names: ['siem reap', 'siemreap', 'siem riep', 'siemriep', 'សៀមរាប'] },
      { id: 'KH18', khmer: 'ព្រះសីហនុ', names: ['preah sihanouk', 'preah sihanuk', 'sihanoukville', 'sihanouk', 'kampong som', 'kompong som', 'ព្រះសីហនុ'] },
      { id: 'KH19', khmer: 'ស្ទឹងត្រែង', names: ['stung treng', 'stoeng treng', 'steung treng', 'ស្ទឹងត្រែង'] },
      { id: 'KH20', khmer: 'ស្វាយរៀង', names: ['svay rieng', 'svay rien', 'svai rieng', 'ស្វាយរៀង'] },
      { id: 'KH21', khmer: 'តាកែវ', names: ['takeo', 'takaev', 'takev', 'ta keo', 'តាកែវ'] },
      { id: 'KH22', khmer: 'ឧត្តរមានជ័យ', names: ['oddar meanchey', 'oddar-meanchey', 'otdar meanchey', 'odor meanchey', 'oddor meanchey', 'ឧត្តរមានជ័យ'] },
      { id: 'KH23', khmer: 'កែប', names: ['kep', 'កែប'] },
      { id: 'KH24', khmer: 'ប៉ៃលិន', names: ['pailin', 'ប៉ៃលិន'] },
      { id: 'KH25', khmer: 'ត្បូងឃ្មុំ', names: ['tboung khmum', 'tbong khmum', 'tboung khmom', 'tbong khmom', 'ត្បូងឃ្មុំ'] }
    ];

    const foundSet = new Set();
    const input = document.getElementById('guess-input');
    const score = document.getElementById('score');
    const unlockedList = document.getElementById('unlocked-list');

    function cleanText(str) {
      // Keep a-z/0-9 AND the Khmer Unicode block (U+1780–U+17FF, which
      // covers Khmer consonants, vowels, and diacritics), strip everything
      // else (spaces, punctuation). toLowerCase() is a no-op on Khmer text
      // since the script has no case, so it's still safe to call.
      return str.toLowerCase().trim().replace(/[^a-z0-9\u1780-\u17ff]/g, '');
    }

    // Levenshtein edit distance, used to accept close-but-not-exact spellings.
    function editDistance(a, b) {
      const m = a.length, n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    // How many typos we tolerate scales with word length, so short names
    // like "Kep" still need to be close, but longer names like
    // "Banteay Meanchey" forgive a couple of mistakes.
    function maxAllowedDistance(len) {
      if (len <= 4) return 0;
      if (len <= 7) return 1;
      if (len <= 12) return 2;
      return 3;
    }

    function findMatch(val) {
      if (!val) return null;
      // Exact match first (covers all listed aliases)
      for (const p of provinces) {
        if (foundSet.has(p.id)) continue;
        if (p.names.some(name => cleanText(name) === val)) return p;
      }
      // Fuzzy match as a fallback
      let best = null;
      let bestDist = Infinity;
      for (const p of provinces) {
        if (foundSet.has(p.id)) continue;
        for (const name of p.names) {
          const cleanName = cleanText(name);
          // Skip candidates the player hasn't finished typing yet. Edit
          // distance alone would let a partial word like "kampo" match
          // "kampot" (it's just 1 deletion away, within typo tolerance),
          // completing the guess before typing is done. Requiring val to be
          // at least as long as the target keeps typo-forgiveness for
          // substitutions/transpositions/extra letters once you're finished,
          // without accepting an incomplete word.
          if (val.length < cleanName.length) continue;
          const dist = editDistance(val, cleanName);
          if (dist <= maxAllowedDistance(cleanName.length) && dist < bestDist) {
            best = p;
            bestDist = dist;
          }
        }
      }
      return best;
    }

    function markFound(p) {
      foundSet.add(p.id);

      const shape = document.getElementById(p.id);
      if (shape) shape.classList.add('found');

      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = p.names[0].toUpperCase();
      unlockedList.appendChild(chip);

      score.textContent = `${foundSet.size} / 25 Provinces`;
      input.value = '';

      if (foundSet.size === 25) {
        score.textContent = "\ud83c\udf89 YOU WON! All 25 Provinces Guessed!";
        input.disabled = true;
      }
    }

    input.addEventListener('input', (e) => {
      const val = cleanText(e.target.value);
      const match = findMatch(val);
      if (match) markFound(match);
    });
  </script>
